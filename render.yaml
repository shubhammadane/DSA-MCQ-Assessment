# Backend only. Deploy frontend/ as a separate Vercel project.
services:
  - type: web
    name: dsa-mcq-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: bash scripts/start-render.sh
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: EXAM_TIMEZONE
        value: Asia/Kolkata
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "15"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
