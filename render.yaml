services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: dsa-mcq-backend
    runtime: python
    rootDir: dsa-mcq-platform/backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed_academic.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dsa-mcq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: EXAM_TIMEZONE
        value: Asia/Kolkata
      - key: FRONTEND_URL
        sync: false

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: static
    name: dsa-mcq-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

# -------------------------------------------------------------
# 3. PostgreSQL Managed Database
# -------------------------------------------------------------
databases:
  - name: dsa-mcq-db
    databaseName: dsa_mcq_db
    user: postgres
    plan: free
